description: >-
  The global constraints of a PyPSA-Eur network. Each kind of global
  constraint and each sense is a constraint of its own, which binds where the
  record holds its limit: `<kind>_<bound>` over `period` for a constraint per
  investment period, `<kind>_horizon_<bound>` for one over the horizon. A
  constraint that selects carriers reads them from `<kind>_carrier`, and the
  carrier weights are the carrier attributes `co2_emissions` and `gas_usage`.
  Translated from PyPSA's `define_primary_energy_limit`,
  `define_operational_limit`, `define_transmission_volume_expansion_limit` and
  `define_transmission_expansion_cost_limit`, and from PyPSA-Eur's
  `solve_network.add_carbon_constraint` (`co2_atmosphere`) and
  `add_carbon_budget_constraint` (`Co2Budget`). Composes onto
  `pypsa.mathspec.yaml`.

given:
  variables:
    capacity: {dims: [entity]}
    p: {dims: [scenario, snapshot, entity]}
    e: {dims: [scenario, snapshot, entity]}
  parameters:
    capital_weight: {dims: [entity, period]}
    period_weighting_years: {dims: [period]}
    snapshot_weighting_generators: {dims: [snapshot]}
    e_initial: {dims: [entity]}
    state_of_charge_initial: {dims: [entity]}
    capital_cost: {dims: [entity]}
    length: {dims: [entity]}
    co2_emissions: {dims: [carrier]}
    gas_usage: {dims: [carrier]}

dimensions:
  scenario: {}
  snapshot: {dtype: datetime, ordered: true}
  period: {dtype: int, ordered: true}
  entity: {}
  bus: {}
  carrier: {}

relations:
  snapshot_period: {key: snapshot, values: period}
  entity_carrier: {key: entity, values: carrier, missing: absent}
  bus_carrier: {key: bus, values: carrier, missing: absent}

parameters:
  co2_limit_upper:
    dims: [period]
    missing: absent
    description: "the upper limit of PyPSA's `primary_energy` limit on CO2 (`co2_emissions`) in each investment period"
  co2_limit_lower:
    dims: [period]
    missing: absent
    description: "the lower limit of PyPSA's `primary_energy` limit on CO2 (`co2_emissions`) in each investment period"
  co2_limit_horizon_upper:
    dims: []
    missing: absent
    description: "the upper limit of PyPSA's `primary_energy` limit on CO2 (`co2_emissions`) over the horizon"
  co2_limit_horizon_lower:
    dims: []
    missing: absent
    description: "the lower limit of PyPSA's `primary_energy` limit on CO2 (`co2_emissions`) over the horizon"
  gas_limit_horizon_upper:
    dims: []
    missing: absent
    description: "the upper limit of PyPSA's `primary_energy` limit on gas (`gas_usage`, `GasLimit`) over the horizon"
  co2_atmosphere_upper:
    dims: [period]
    missing: absent
    description: "the upper limit of `solve_network.add_carbon_constraint`: the change of the CO2 stores over a period (`co2_atmosphere`) in each investment period"
  co2_atmosphere_lower:
    dims: [period]
    missing: absent
    description: "the lower limit of `solve_network.add_carbon_constraint`: the change of the CO2 stores over a period (`co2_atmosphere`) in each investment period"
  co2_budget_upper:
    dims: [period]
    missing: absent
    description: "the upper limit of `solve_network.add_carbon_budget_constraint`: the CO2 stores at the end of a period, times its years (`Co2Budget`) in each investment period"
  co2_budget_lower:
    dims: [period]
    missing: absent
    description: "the lower limit of `solve_network.add_carbon_budget_constraint`: the CO2 stores at the end of a period, times its years (`Co2Budget`) in each investment period"
  co2_sequestration_limit_lower:
    dims: [period]
    missing: absent
    description: "the lower limit of `solve_network.add_co2_sequestration_limit`: PyPSA's operational limit on `co2 sequestered` in each investment period"
  biomass_limit_horizon_upper:
    dims: []
    missing: absent
    description: "the upper limit of PyPSA's operational limit on `solid biomass` (`biomass limit`) over the horizon"
  unsustainable_biomass_limit_horizon_equal:
    dims: []
    missing: absent
    description: "the equal limit of PyPSA's operational limit on `unsustainable solid biomass` over the horizon"
  msw_limit_horizon_equal:
    dims: []
    missing: absent
    description: "the equal limit of PyPSA's operational limit on `municipal solid waste` (`msw limit`) over the horizon"
  transmission_volume_limit_horizon_upper:
    dims: []
    missing: absent
    description: "the upper limit of PyPSA's `transmission_volume_expansion_limit` (`lv_limit`) over the horizon"
  transmission_cost_limit_horizon_upper:
    dims: []
    missing: absent
    description: "the upper limit of PyPSA's `transmission_expansion_cost_limit` (`lc_limit`) over the horizon"
  co2_sequestration_limit_carrier:
    dims: [carrier]
    dtype: int
    missing: 0
    description: "1 for a carrier that `solve_network.add_co2_sequestration_limit`: PyPSA's operational limit on `co2 sequestered` selects"
  biomass_limit_carrier:
    dims: [carrier]
    dtype: int
    missing: 0
    description: "1 for a carrier that PyPSA's operational limit on `solid biomass` (`biomass limit`) selects"
  unsustainable_biomass_limit_carrier:
    dims: [carrier]
    dtype: int
    missing: 0
    description: "1 for a carrier that PyPSA's operational limit on `unsustainable solid biomass` selects"
  msw_limit_carrier:
    dims: [carrier]
    dtype: int
    missing: 0
    description: "1 for a carrier that PyPSA's operational limit on `municipal solid waste` (`msw limit`) selects"
  transmission_volume_limit_carrier:
    dims: [carrier]
    dtype: int
    missing: 0
    description: "1 for a carrier that PyPSA's `transmission_volume_expansion_limit` (`lv_limit`) selects"
  transmission_cost_limit_carrier:
    dims: [carrier]
    dtype: int
    missing: 0
    description: "1 for a carrier that PyPSA's `transmission_expansion_cost_limit` (`lc_limit`) selects"
  glc_generator: {dims: [entity], dtype: int, missing: 0, description: 1 for a generator}
  glc_generator_fuel:
    dims: [entity]
    missing: 0
    description: the fuel a generator burns per unit of output, one over its efficiency
  glc_store_final:
    dims: [snapshot, entity]
    missing: 0
    description: >-
      the years of the period at its last snapshot, for an active non-cyclic store
      that resets each period
  glc_storage_unit_final:
    dims: [snapshot, entity]
    missing: 0
    description: >-
      the years of the period at its last snapshot, for an active non-cyclic
      storage unit that resets each period
  glc_co2_store:
    dims: [snapshot, entity]
    dtype: int
    missing: 0
    description: 1 at the last snapshot of each period for a non-cyclic store on a bus of an emitting carrier
  glc_branch_horizon:
    dims: [entity]
    dtype: int
    missing: 0
    description: 1 for an extendable line or link that stands in some period

expressions:
  glc_period_weight:
    dims: [snapshot]
    expression: snapshot_weighting_generators * at(period_weighting_years, by=snapshot_period[period])
  glc_output:
    dims: [scenario, carrier, period]
    description: what the generators of a carrier produce in a period, weighted by snapshot and period years
    expression: >-
      sum(sum(p * glc_generator, over=entity, by=entity_carrier[carrier]) * glc_period_weight,
      over=snapshot, by=snapshot_period[period])
  glc_fuel:
    dims: [scenario, carrier, period]
    description: what the generators of a carrier consume in a period, their output over their efficiency
    expression: >-
      sum(sum(p * glc_generator_fuel, over=entity, by=entity_carrier[carrier]) * glc_period_weight,
      over=snapshot, by=snapshot_period[period])
  glc_drawdown:
    dims: [scenario, carrier, period]
    description: >-
      what the non-cyclic storage of a carrier, reset each period, gives up over a
      period: its initial level less its final one, weighted by period years
    expression: >-
      sum(sum(e_initial * glc_store_final, over=entity, by=entity_carrier[carrier])
      + sum(state_of_charge_initial * glc_storage_unit_final, over=entity, by=entity_carrier[carrier])
      - sum(e * glc_store_final, over=entity, by=entity_carrier[carrier])
      - sum(e * glc_storage_unit_final, over=entity, by=entity_carrier[carrier]),
      over=snapshot, by=snapshot_period[period])
  glc_co2_level:
    dims: [scenario, period]
    description: the level of the stores on emission buses at the end of a period
    expression: sum(sum(e * glc_co2_store, over=entity), over=snapshot, by=snapshot_period[period])
  glc_co2_emitted:
    dims: [scenario, period]
    description: the CO2 the generators and the storage drawdown emit in a period
    expression: sum((glc_fuel + glc_drawdown) * co2_emissions, over=carrier)
  glc_gas_used:
    dims: [scenario, period]
    description: the gas the generators and the storage drawdown use in a period
    expression: sum((glc_fuel + glc_drawdown) * gas_usage, over=carrier)
  glc_co2_change:
    dims: [scenario, period]
    expression: glc_co2_level - shift(glc_co2_level, along=period, offset=1, edge=0)
  glc_co2_budget:
    dims: [scenario, period]
    expression: glc_co2_level * period_weighting_years
  glc_co2_sequestration_limit_use:
    dims: [scenario, period]
    description: what the generators and the storage drawdown of the carriers of `co2_sequestration_limit` give in a period
    expression: sum((glc_output + glc_drawdown) * co2_sequestration_limit_carrier, over=carrier)
  glc_biomass_limit_use:
    dims: [scenario, period]
    description: what the generators and the storage drawdown of the carriers of `biomass_limit` give in a period
    expression: sum((glc_output + glc_drawdown) * biomass_limit_carrier, over=carrier)
  glc_unsustainable_biomass_limit_use:
    dims: [scenario, period]
    description: what the generators and the storage drawdown of the carriers of `unsustainable_biomass_limit` give in a period
    expression: sum((glc_output + glc_drawdown) * unsustainable_biomass_limit_carrier, over=carrier)
  glc_msw_limit_use:
    dims: [scenario, period]
    description: what the generators and the storage drawdown of the carriers of `msw_limit` give in a period
    expression: sum((glc_output + glc_drawdown) * msw_limit_carrier, over=carrier)
  glc_volume_horizon:
    dims: [carrier]
    expression: sum(capacity * length * glc_branch_horizon, over=entity, by=entity_carrier[carrier])
  glc_cost_horizon:
    dims: [carrier]
    expression: >-
      sum(capacity * capital_cost * sum(capital_weight, over=period) * glc_branch_horizon,
      over=entity, by=entity_carrier[carrier])

constraints:
  GlobalConstraint_co2_limit_upper:
    dims: [scenario, period]
    description: PyPSA's `primary_energy` limit on CO2 (`co2_emissions`)
    where: co2_limit_upper
    expression: glc_co2_emitted <= co2_limit_upper
  GlobalConstraint_co2_limit_lower:
    dims: [scenario, period]
    description: PyPSA's `primary_energy` limit on CO2 (`co2_emissions`)
    where: co2_limit_lower
    expression: glc_co2_emitted >= co2_limit_lower
  GlobalConstraint_co2_limit_horizon_upper:
    dims: [scenario]
    description: PyPSA's `primary_energy` limit on CO2 (`co2_emissions`)
    where: co2_limit_horizon_upper
    expression: sum(glc_co2_emitted, over=period) <= co2_limit_horizon_upper
  GlobalConstraint_co2_limit_horizon_lower:
    dims: [scenario]
    description: PyPSA's `primary_energy` limit on CO2 (`co2_emissions`)
    where: co2_limit_horizon_lower
    expression: sum(glc_co2_emitted, over=period) >= co2_limit_horizon_lower
  GlobalConstraint_gas_limit_horizon_upper:
    dims: [scenario]
    description: PyPSA's `primary_energy` limit on gas (`gas_usage`, `GasLimit`)
    where: gas_limit_horizon_upper
    expression: sum(glc_gas_used, over=period) <= gas_limit_horizon_upper
  GlobalConstraint_co2_atmosphere_upper:
    dims: [scenario, period]
    description: "`solve_network.add_carbon_constraint`: the change of the CO2 stores over a period (`co2_atmosphere`)"
    where: co2_atmosphere_upper
    expression: glc_co2_change <= co2_atmosphere_upper
  GlobalConstraint_co2_atmosphere_lower:
    dims: [scenario, period]
    description: "`solve_network.add_carbon_constraint`: the change of the CO2 stores over a period (`co2_atmosphere`)"
    where: co2_atmosphere_lower
    expression: glc_co2_change >= co2_atmosphere_lower
  GlobalConstraint_co2_budget_upper:
    dims: [scenario, period]
    description: "`solve_network.add_carbon_budget_constraint`: the CO2 stores at the end of a period, times its years (`Co2Budget`)"
    where: co2_budget_upper
    expression: glc_co2_budget <= co2_budget_upper
  GlobalConstraint_co2_budget_lower:
    dims: [scenario, period]
    description: "`solve_network.add_carbon_budget_constraint`: the CO2 stores at the end of a period, times its years (`Co2Budget`)"
    where: co2_budget_lower
    expression: glc_co2_budget >= co2_budget_lower
  GlobalConstraint_co2_sequestration_limit_lower:
    dims: [scenario, period]
    description: "`solve_network.add_co2_sequestration_limit`: PyPSA's operational limit on `co2 sequestered`"
    where: co2_sequestration_limit_lower
    expression: glc_co2_sequestration_limit_use >= co2_sequestration_limit_lower
  GlobalConstraint_biomass_limit_horizon_upper:
    dims: [scenario]
    description: PyPSA's operational limit on `solid biomass` (`biomass limit`)
    where: biomass_limit_horizon_upper
    expression: sum(glc_biomass_limit_use, over=period) <= biomass_limit_horizon_upper
  GlobalConstraint_unsustainable_biomass_limit_horizon_equal:
    dims: [scenario]
    description: PyPSA's operational limit on `unsustainable solid biomass`
    where: unsustainable_biomass_limit_horizon_equal
    expression: sum(glc_unsustainable_biomass_limit_use, over=period) == unsustainable_biomass_limit_horizon_equal
  GlobalConstraint_msw_limit_horizon_equal:
    dims: [scenario]
    description: PyPSA's operational limit on `municipal solid waste` (`msw limit`)
    where: msw_limit_horizon_equal
    expression: sum(glc_msw_limit_use, over=period) == msw_limit_horizon_equal
  GlobalConstraint_transmission_volume_limit_horizon_upper:
    dims: []
    description: PyPSA's `transmission_volume_expansion_limit` (`lv_limit`)
    where: transmission_volume_limit_horizon_upper
    expression: sum(glc_volume_horizon * transmission_volume_limit_carrier, over=carrier) <= transmission_volume_limit_horizon_upper
  GlobalConstraint_transmission_cost_limit_horizon_upper:
    dims: []
    description: PyPSA's `transmission_expansion_cost_limit` (`lc_limit`)
    where: transmission_cost_limit_horizon_upper
    expression: sum(glc_cost_horizon * transmission_cost_limit_carrier, over=carrier) <= transmission_cost_limit_horizon_upper
