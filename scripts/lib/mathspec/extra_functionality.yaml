description: >-
  The constraints `solve_network` adds beyond PyPSA's model
  (`extra_functionality`), and the ones PyPSA builds from the data that
  `solve_network.prepare_network` sets for perfect foresight (land-use limits
  per bus and carrier, growth limits per carrier). A constraint has rows only
  where the record holds its data, which the export writes for the
  constraints the config activates. Pairs of entities that a constraint ties
  together are relations from an entity to its `partner`. Composes onto
  `pypsa.mathspec.yaml`.

given:
  variables:
    nom: {dims: [entity]}
    p: {dims: [scenario, snapshot, entity]}
    spill: {dims: [scenario, snapshot, entity]}
  parameters:
    extendable: {dims: [entity], dtype: bool}
    snapshot_weighting_generators: {dims: [snapshot]}
    snapshot_weighting_stores: {dims: [snapshot]}
    nominal: {dims: [entity]}
    p_max_pu: {dims: [scenario, snapshot, entity]}
    p_set: {dims: [scenario, snapshot, entity]}
    inflow: {dims: [scenario, snapshot, entity]}
    max_growth: {dims: [carrier]}
    max_relative_growth: {dims: [carrier]}

dimensions:
  scenario: {}
  snapshot: {dtype: datetime, ordered: true}
  period: {dtype: int, ordered: true}
  entity: {}
  bus: {}
  carrier: {}

relations:
  snapshot_period: {key: snapshot, values: period}
  entity_carrier: {key: entity, values: carrier, missing: absent}
  bus_carrier: {key: bus, values: carrier, missing: absent}
  tes_store_charger:
    key: entity
    values: {partner: entity}
    description: a thermal energy store and its charger (`add_TES_energy_to_power_ratio_constraints`)
  tes_charger_discharger:
    key: entity
    values: {partner: entity}
    description: a thermal energy storage charger and its discharger (`add_TES_charger_ratio_constraints`)
  battery_charger_discharger:
    key: entity
    values: {partner: entity}
    description: a battery charger and its discharger (`add_battery_constraints`)
  reversed_forward:
    key: entity
    values: {partner: entity}
    description: a reversed lossy link and its forward link (`add_lossy_bidirectional_link_constraints`)
  pipe_retrofit:
    key: entity
    values: {partner: entity}
    description: a gas pipeline and the H2 pipeline retrofitted from it (`add_pipe_retrofit_constraint`)
  egs_storage_well:
    key: entity
    values: {partner: entity}
    description: a geothermal reservoir and its well (`add_flexible_egs_constraint`)
  gas_retrofit:
    key: entity
    values: {partner: entity}
    description: an existing gas boiler and the H2 boiler it can be retrofitted to (`add_retrofit_gas_boiler_constraint`)
  gas_retrofit_heat_load:
    key: entity
    values: {partner: entity}
    description: an existing gas boiler and the heat load at its output bus


parameters:
  land_use_limit:
    dims: [entity, bus, period]
    missing: absent
    description: >-
      `p_nom_max` of an extendable generator with a finite potential, at its bus
      and in the period of its build year
  land_use_weight:
    dims: [entity, bus, period]
    dtype: int
    missing: 0
    description: 1 for an extendable generator, storage unit or store at its bus in each period it stands in
  growth_first:
    dims: [entity, period]
    dtype: int
    missing: 0
    description: 1 for an extendable entity in the first period it stands in (PyPSA's `add_max_growth`)
  bau_mincapacity: {dims: [carrier], missing: absent, description: "`electricity.BAU_mincapacities`"}
  bau_generator: {dims: [entity], dtype: int, missing: 0, description: 1 for an extendable generator}
  safe_peak_capacity:
    dims: []
    missing: absent
    description: the peak load times one plus `electricity.SAFE_reservemargin`
  safe_extendable:
    dims: [entity]
    dtype: int
    missing: 0
    description: 1 for an extendable generator of `electricity.conventional_carriers`
  safe_fixed:
    dims: [entity]
    dtype: int
    missing: 0
    description: 1 for a fixed generator of `electricity.conventional_carriers`
  reserve_generator:
    dims: [entity]
    dtype: bool
    missing: neutral
    description: a generator that holds operational reserve (all but load shedding)
  reserve_load: {dims: [entity], dtype: int, missing: 0, description: 1 for a load}
  reserve_vres_extendable:
    dims: [entity]
    dtype: int
    missing: 0
    description: 1 for an extendable reserve generator of a variable renewable carrier
  reserve_vres_fixed:
    dims: [entity]
    dtype: int
    missing: 0
    description: 1 for a fixed reserve generator of a variable renewable carrier
  reserve_epsilon_load: {dims: [], missing: absent, description: "`operational_reserve.epsilon_load`"}
  reserve_epsilon_vres: {dims: [], missing: absent, description: "`operational_reserve.epsilon_vres`"}
  reserve_contingency: {dims: [], missing: absent, description: "`operational_reserve.contingency`"}
  equity_min_share: {dims: [], missing: absent, description: the share of its demand a node produces (`EQ`)}
  equity_bus: {dims: [bus], dtype: bool, missing: neutral, description: a bus with a load}
  equity_generator: {dims: [entity, bus], dtype: int, missing: 0, description: 1 for a generator at its bus}
  equity_load: {dims: [entity, bus], dtype: int, missing: 0, description: 1 for a load at its bus}
  equity_storage_unit: {dims: [entity, bus], dtype: int, missing: 0, description: 1 for a storage unit at its bus}
  solar_potential_generator:
    dims: [entity, bus]
    missing: 0
    description: >-
      the land a unit of capacity of an extendable solar generator takes at its
      bus, relative to fixed solar
  solar_potential_limit:
    dims: [bus]
    missing: absent
    description: >-
      the potential of extendable fixed solar at a bus with tracking solar, less
      what the existing tracking solar takes, at least zero
  tes_energy_to_power_ratio:
    dims: [entity]
    missing: absent
    description: the energy to power ratio of a thermal energy store's charger
  discharger_efficiency:
    dims: [entity]
    missing: absent
    description: the efficiency of a charger's discharger
  pipe_retrofit_ch4_per_h2: {dims: [], missing: absent, description: one over `sector.H2_retrofit_capacity_per_CH4`}
  heat_load_profile:
    dims: [snapshot, entity]
    missing: absent
    description: a heat load over its peak in the period
  import_weight:
    dims: [entity]
    missing: absent
    description: what one unit of flow of an import generator or link counts toward the import limit
  import_limit: {dims: [], missing: absent, description: "`sector.imports.limit` over the modelled years"}
  import_limit_sense: {dims: [], dtype: str, missing: absent, description: "`sector.imports.limit_sense`"}

expressions:
  land_use_capacity:
    dims: [bus, carrier, period]
    expression: sum(nom * land_use_weight, over=entity, by=entity_carrier[carrier])
  growth_capacity:
    dims: [carrier, period]
    expression: sum(nom * growth_first, over=entity, by=entity_carrier[carrier])

variables:
  Generator_r:
    dims: [scenario, snapshot, entity]
    where: reserve_generator
    bounds: {lower: 0}
    description: the operational reserve a generator holds

constraints:
  land_use_constraint:
    dims: [entity, bus, period]
    description: >-
      `add_land_use_constraint`: the extendable capacity of a carrier at a bus
      that stands in a period, at most the potential of each extendable
      generator of that carrier built at that bus in that period (PyPSA's bus
      columns `nom_max_{carrier}_{period}` hold the smallest of them)
    where: land_use_limit
    expression: at(land_use_capacity, by=entity_carrier[carrier]) <= land_use_limit
  Carrier_growth_limit:
    dims: [carrier, period]
    description: PyPSA's growth limit from `max_growth` and `max_relative_growth` (`add_max_growth`)
    where: max_growth < inf
    expression: >-
      growth_capacity - max_relative_growth * shift(growth_capacity, along=period, offset=1, edge=0)
      <= max_growth
  bau_mincaps:
    dims: [carrier]
    description: "`add_BAU_constraints`"
    where: bau_mincapacity
    expression: sum(nom * bau_generator, over=entity, by=entity_carrier[carrier]) >= bau_mincapacity
  safe_mintotalcap:
    dims: []
    description: "`add_SAFE_constraints`"
    where: safe_peak_capacity
    expression: sum(nom * safe_extendable, over=entity) >= safe_peak_capacity - sum(nominal * safe_fixed, over=entity)
  reserve_margin:
    dims: [scenario, snapshot]
    description: "`add_operational_reserve_margin`: the reserve requirement"
    where: reserve_contingency
    expression: >-
      sum(Generator_r, over=entity)
      - reserve_epsilon_vres * sum(nom * p_max_pu * reserve_vres_extendable, over=entity)
      >= reserve_epsilon_load * sum(p_set * reserve_load, over=entity)
      + reserve_epsilon_vres * sum(p_max_pu * nominal * reserve_vres_fixed, over=entity)
      + reserve_contingency
  Generator_p_reserve_upper_extendable:
    dims: [scenario, snapshot, entity]
    description: "`add_operational_reserve_margin`: dispatch and reserve within extendable capacity"
    where: Generator_r AND p AND extendable
    expression: p + Generator_r - p_max_pu * nom <= 0
  Generator_p_reserve_upper_extendable_idle:
    dims: [scenario, snapshot, entity]
    description: "`add_operational_reserve_margin`: reserve within extendable capacity where the unit does not dispatch"
    where: Generator_r AND NOT p AND extendable
    expression: Generator_r - p_max_pu * nom <= 0
  Generator_p_reserve_upper_fixed:
    dims: [scenario, snapshot, entity]
    description: "`add_operational_reserve_margin`: dispatch and reserve within fixed capacity"
    where: Generator_r AND p AND NOT extendable
    expression: p + Generator_r <= p_max_pu * nominal
  Generator_p_reserve_upper_fixed_idle:
    dims: [scenario, snapshot, entity]
    description: "`add_operational_reserve_margin`: reserve within fixed capacity where the unit does not dispatch"
    where: Generator_r AND NOT p AND NOT extendable
    expression: Generator_r <= p_max_pu * nominal
  equity_min:
    dims: [scenario, bus]
    description: "`add_EQ_constraints` per node"
    where: equity_min_share AND equity_bus
    expression: >-
      0.1 * sum(p * equity_generator * snapshot_weighting_generators, over=[snapshot, entity])
      - 0.1 * sum(spill * equity_storage_unit * snapshot_weighting_stores, over=[snapshot, entity])
      >= 0.1 * (equity_min_share * sum(p_set * equity_load * snapshot_weighting_generators, over=[snapshot, entity])
      - sum(inflow * equity_storage_unit * snapshot_weighting_stores, over=[snapshot, entity]))
  solar_potential:
    dims: [bus]
    description: "`add_solar_potential_constraints`"
    where: solar_potential_limit
    expression: sum(nom * solar_potential_generator, over=entity) <= solar_potential_limit
  TES_energy_to_power_ratio:
    dims: [entity]
    description: "`add_TES_energy_to_power_ratio_constraints`"
    where: tes_store_charger AND tes_energy_to_power_ratio
    expression: nom - tes_energy_to_power_ratio * at(nom, by=tes_store_charger[partner]) == 0
  TES_charger_ratio:
    dims: [entity]
    description: "`add_TES_charger_ratio_constraints`"
    where: tes_charger_discharger AND discharger_efficiency
    expression: nom - discharger_efficiency * at(nom, by=tes_charger_discharger[partner]) == 0
  Link_charger_ratio:
    dims: [entity]
    description: "`add_battery_constraints`"
    where: battery_charger_discharger AND discharger_efficiency
    expression: nom - discharger_efficiency * at(nom, by=battery_charger_discharger[partner]) == 0
  Link_bidirectional_sync:
    dims: [entity]
    description: "`add_lossy_bidirectional_link_constraints`"
    where: reversed_forward
    expression: nom - at(nom, by=reversed_forward[partner]) == 0
  Link_pipe_retrofit:
    dims: [entity]
    description: "`add_pipe_retrofit_constraint`"
    where: pipe_retrofit AND pipe_retrofit_ch4_per_h2
    expression: nom + pipe_retrofit_ch4_per_h2 * at(nom, by=pipe_retrofit[partner]) == nominal
  upper_bound_charging_capacity_of_geothermal_reservoir:
    dims: [entity]
    description: "`add_flexible_egs_constraint`"
    where: egs_storage_well
    expression: nom - at(nom, by=egs_storage_well[partner]) <= 0
  gas_retrofit:
    dims: [scenario, snapshot, entity]
    description: "`add_retrofit_gas_boiler_constraint`, where both boilers dispatch"
    where: gas_retrofit AND gas_retrofit_heat_load AND p AND at(p, by=gas_retrofit[partner])
    expression: p + at(p, by=gas_retrofit[partner]) == nominal * at(heat_load_profile, by=gas_retrofit_heat_load[partner])
  gas_retrofit_alone:
    dims: [scenario, snapshot, entity]
    description: "`add_retrofit_gas_boiler_constraint`, where the H2 boiler does not dispatch"
    where: gas_retrofit AND gas_retrofit_heat_load AND p AND NOT at(p, by=gas_retrofit[partner])
    expression: p == nominal * at(heat_load_profile, by=gas_retrofit_heat_load[partner])
  import_limit_upper:
    dims: [scenario]
    description: "`add_import_limit_constraint`"
    where: "import_limit AND import_limit_sense == '<='"
    expression: sum(p * import_weight * snapshot_weighting_generators, over=[snapshot, entity]) <= import_limit
  import_limit_lower:
    dims: [scenario]
    description: "`add_import_limit_constraint`"
    where: "import_limit AND import_limit_sense == '>='"
    expression: sum(p * import_weight * snapshot_weighting_generators, over=[snapshot, entity]) >= import_limit
  import_limit_equal:
    dims: [scenario]
    description: "`add_import_limit_constraint`"
    where: "import_limit AND import_limit_sense == '=='"
    expression: sum(p * import_weight * snapshot_weighting_generators, over=[snapshot, entity]) == import_limit
