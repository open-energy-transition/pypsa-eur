tutorial: true

run:
  name: test-elec-preaggregated-perfect
  disable_progressbar: true
  shared_resources:
    policy: false

countries:
- BE

foresight: perfect
planning_horizons: [2030, 2040, 2050]

snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: left

electricity:
  gaslimit_enable: false
  transmission_limit: vopt
  extendable_carriers:
    Generator:
    - solar
    - solar-hsat
    - onwind
    - offwind-ac
    - offwind-dc
    - offwind-float
    - OCGT
    - CCGT
    - nuclear
    StorageUnit:
    - battery
    Store:
    - H2
    Link:
    - H2 pipeline
  renewable_carriers:
  - solar
  - solar-hsat
  - onwind
  - offwind-ac
  - offwind-dc
  - offwind-float
  estimate_renewable_capacities:
    enable: true
    from_powerplantmatching: true
    year: 2020
    expansion_limit: false
    technology_mapping:
      Offshore: offwind-ac
      Onshore: onwind
      PV: solar

existing_capacities:
  grouping_years_power:
  - 1900
  - 2025
  conventional_carriers: []

renewable:
  offwind-ac:
    max_depth: false
  offwind-dc:
    max_depth: false
  offwind-float:
    max_depth: false
    min_depth: false

clustering:
  keep_assets: false
  exclude_carriers: []
  temporal:
    averaging: false
    segmentation: 730
  cluster_network:
    n_clusters: 5

sector:
  enabled: false
  heating: false

solving:
  solver:
    name: highs
    options: highs-hipo
  mem_mb: 4000
  check_objective:
    enable: false
  options:
    transmission_losses: false

conventional:
  dynamic_fuel_price: false
  unit_commitment: false
  nuclear:
    p_max_pu: data/nuclear_p_max_pu.csv
