# Configuration for the `module_hydropower` model block, composed into pypsa-eur
# via `rules/modules/hydropower.smk`, which also asserts that `years` (end year
# exclusive) covers the pypsa-eur `snapshots` period.

pfafstetter_level: "06"  # matches the ~30 km resolution of the ERA5 input

years:
  start: 2013
  end: 2014

powerplants:
  technology_mapping:
    run_of_river: "Run-Of-River"
    reservoir: "Reservoir"
  basin_adjustment:
    buffer_radius: 1000  # epsg:3035 is in metres
    max_outside: 50
    max_dropped: 30

crs:  # epsg:3035 = ETRS89 extended LAEA Europe, as in geo_boundaries / pypsa-eur
  projected: "epsg:3035"
  geographic: "epsg:4326"

smoothing_hours: "72h"
